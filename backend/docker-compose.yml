version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: smartanalytics_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: smartanalytics123
      MONGO_INITDB_DATABASE: smartanalytics
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - smartanalytics

  redis:
    image: redis:7-alpine
    container_name: smartanalytics_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass smartanalytics123
    volumes:
      - redis_data:/data
    networks:
      - smartanalytics

  mongo-express:
    image: mongo-express:latest
    container_name: smartanalytics_mongo_ui
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: smartanalytics123
      ME_CONFIG_MONGODB_URL: mongodb://admin:smartanalytics123@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - smartanalytics

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  smartanalytics:
    driver: bridge
